name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0, v1.0.0-alpha, v1.0.0-beta.1)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: validate
        uses: ./.github/actions/validate-version
        with:
          version: ${{ github.event.inputs.version }}

  build:
    name: Build Release Binaries
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linked against glibc 2.17 via cargo-zigbuild: a plain cargo build
          # needs the runner's glibc or newer, so ubuntu-latest's broke on
          # Ubuntu 22.04 (nxcite/nx-cache-server#7).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            glibc: '2.17'
            name: nx-cache-aws-${{ needs.validate.outputs.version }}-linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            glibc: '2.17'
            name: nx-cache-aws-${{ needs.validate.outputs.version }}-linux-arm64

          - target: x86_64-apple-darwin
            os: macos-latest
            name: nx-cache-aws-${{ needs.validate.outputs.version }}-macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-latest
            name: nx-cache-aws-${{ needs.validate.outputs.version }}-macos-arm64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: nx-cache-aws-${{ needs.validate.outputs.version }}-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Zig and cargo-zigbuild
        if: matrix.glibc
        run: |
          pip3 install --break-system-packages ziglang==0.17.1
          cargo install --locked cargo-zigbuild@0.24.1

      - name: Build release binary
        if: ${{ !matrix.glibc }}
        run: cargo build --release --locked --bin nx-cache-aws --target ${{ matrix.target }}

      - name: Build release binary (glibc ${{ matrix.glibc }})
        if: matrix.glibc
        run: cargo zigbuild --release --locked --bin nx-cache-aws --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Prepare binary for release
        uses: ./.github/actions/prepare-binary
        with:
          target: ${{ matrix.target }}
          binary-name: nx-cache-aws
          artifact-name: ${{ matrix.name }}

  create-tag-and-release:
    name: Create Tag and GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        uses: ./.github/actions/create-release
        with:
          version: ${{ needs.validate.outputs.version }}
          release-notes: ${{ github.event.inputs.release_notes }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The container image is published from here rather than from a `push: tags:`
  # trigger on docker.yml: the tag above is created with GITHUB_TOKEN, and
  # events raised by GITHUB_TOKEN do not start new workflow runs.
  image:
    name: Build and Push Image
    needs: [validate, create-tag-and-release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.validate.outputs.version }}
