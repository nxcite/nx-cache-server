name: Build and push image

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Releases are cut by workflow_dispatch on release.yml, which creates the tag
  # with `gh release create` using GITHUB_TOKEN. Events raised by GITHUB_TOKEN
  # do not start new workflow runs, so a `push: tags:` trigger here would never
  # fire; release.yml calls this workflow directly instead and passes the
  # version it just validated.
  workflow_call:
    inputs:
      version:
        description: "Release version to tag the image with (e.g. v1.2.0)"
        type: string
        required: false
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

# Serialise builds per ref so two pushes in quick succession can't finish out of
# order and leave the older commit as :master. Only PR builds are cancelled -
# a superseded PR build is waste, whereas cancelling a release build would ship
# a release with no image.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One native runner per architecture. Building both platforms in a single job
  # would put arm64 through QEMU (~10x slower for a release build); hosted arm
  # runners are free on public repos, so each half compiles natively.
  # Each job pushes an untagged, digest-only image; the manifest job below
  # stitches the two digests into one multi-arch tag.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # No setup-qemu-action: each runner is its target architecture.
      - uses: docker/setup-buildx-action@v4

      # Fork PRs can't push to GHCR; only log in / push on our own refs.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-arch cache scope: the default scope is shared, so the two jobs
          # would otherwise evict each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # PRs build only (nothing to push to); pushes export by digest with no
          # tag, leaving the tagging to the manifest job.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # type=semver parses the release version passed by release.yml, which
          # strips the leading v and (via the default latest=auto) also tags
          # :latest for non-prerelease versions.
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # word splitting is what builds the arg list
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
