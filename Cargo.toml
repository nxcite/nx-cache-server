[package]
name = "nx-cache-server"
version = "0.1.0"
edition = "2021"

# AWS binary
[[bin]]
name = "nx-cache-aws"
path = "src/bin/aws.rs"

[dependencies]
# Core dependencies
# "time" is for the bound on `drain_body` (see server/mod.rs). It was already
# reaching us transitively via the AWS SDK; declare it rather than rely on that.
tokio = { version = "1.0", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
tokio-stream = "0.1"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
thiserror = "1.0"
subtle = "2.5"
aws-config = { version = "1.0", default-features = false }
aws-sdk-s3 = { version = "1.0", default-features = false, features = ["rt-tokio"] }
# TLS via rustls + ring instead of the SDK default aws-lc-rs, which pulls in
# aws-lc-sys (C/CMake/NASM toolchain) and breaks cross-platform release builds.
aws-smithy-http-client = { version = "1.1", default-features = false, features = ["rustls-ring"] }
aws-credential-types = "1.2.10"

[dev-dependencies]
# `ServiceExt::oneshot` drives the whole router (auth layer included) in-process,
# so the response table below doesn't need a socket per case.
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true         # Remove all symbols
lto = true           # Link-time optimization  
codegen-units = 1    # Better optimization
panic = "abort"      # Don't include unwinding code
